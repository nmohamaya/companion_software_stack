name: CI

on:
  push:
    branches: [main, develop, 'integration/**']
  pull_request:
    branches: [main, 'integration/**']

env:
  CI_BASE: origin/${{ github.base_ref || 'main' }}

jobs:
  format-check:
    runs-on: ubuntu-24.04
    name: format-check
    steps:
    - uses: actions/checkout@v4
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-format-18
    - run: bash deploy/ci_job.sh FMT

  doc-lint:
    runs-on: ubuntu-24.04
    name: doc-lint
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: bash deploy/ci_job.sh DOC

  cppcheck:
    runs-on: ubuntu-24.04
    name: cppcheck (advisory)
    steps:
    - uses: actions/checkout@v4
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cppcheck
    - run: bash deploy/ci_job.sh CPPCHECK
    - name: Upload static-analysis evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidence-static-analysis
        path: evidence/static-analysis/
        retention-days: 14

  safety-audit:
    runs-on: ubuntu-24.04
    name: safety-audit (advisory)
    steps:
    - uses: actions/checkout@v4
    - run: bash deploy/ci_job.sh AUDIT
    - name: Upload safety-audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidence-safety-audit
        path: evidence/safety-audit/
        retention-days: 14

  # Keep these independent of formatting so a format failure cannot hide a
  # sanitizer failure.
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - {variant: default, job: BUILD}
        - {variant: asan, job: ASAN}
        - {variant: tsan, job: TSAN}
        - {variant: ubsan, job: UBSAN}
    name: build (${{ matrix.variant }})
    steps:
    - uses: actions/checkout@v4
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake libspdlog-dev libeigen3-dev nlohmann-json3-dev libgtest-dev unzip
    - name: Fix ASLR for TSan
      if: matrix.variant == 'tsan'
      run: sudo sysctl vm.mmap_rnd_bits=28
    - name: Build and test
      env:
        MATRIX_JOB: ${{ matrix.job }}
      run: bash deploy/ci_job.sh "$MATRIX_JOB"
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidence-tests-${{ matrix.variant }}
        path: evidence/tests/
        retention-days: 14

  coverage:
    runs-on: ubuntu-24.04
    name: coverage
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake libspdlog-dev libeigen3-dev nlohmann-json3-dev libgtest-dev lcov unzip
        sudo apt-get install -y --no-install-recommends clang-tidy-18 || true
    - run: bash deploy/ci_job.sh COV
    - name: Upload coverage evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidence-coverage
        path: evidence/coverage/
        retention-days: 14

  orchestrator-tests:
    runs-on: ubuntu-24.04
    name: orchestrator-tests
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: bash deploy/ci_job.sh PYTHON
