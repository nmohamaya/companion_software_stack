name: Agent Checks

on:
  pull_request:
    branches: [main, 'integration/**']

jobs:
  # ── Agent boundary enforcement (warning-only) ──────────────────
  agent-boundaries:
    runs-on: ubuntu-24.04
    name: agent-boundaries
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check agent boundaries
      env:
        BRANCH: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        CI_BRANCH="$BRANCH" CI_BASE="origin/$BASE_REF" bash deploy/ci_job.sh BOUNDARIES

  # ── PR size check ──────────────────────────────────────────────
  pr-size:
    runs-on: ubuntu-24.04
    name: pr-size
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR size
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        CI_BASE="origin/$BASE_REF" bash deploy/ci_job.sh PR_SIZE
